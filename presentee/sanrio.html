<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seu lado fofo</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #fff7fc;
    color: #3d3040;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   PÁGINA
========================================================= */

.sanrio-page {
    position: relative;
    min-height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 10% 15%,
            rgba(255, 170, 210, .35),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 75%,
            rgba(190, 160, 255, .30),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #fff9fc 0%,
            #fdf2fa 50%,
            #f7f1ff 100%
        );
}


/* =========================================================
   LUZES
========================================================= */

.pink-light {
    position: absolute;

    width: 450px;
    height: 450px;

    left: -180px;
    top: 80px;

    border-radius: 50%;

    background: rgba(255, 150, 205, .22);

    filter: blur(100px);

    animation: softPulse 6s ease-in-out infinite;

    pointer-events: none;
}


.purple-light {
    position: absolute;

    width: 450px;
    height: 450px;

    right: -180px;
    bottom: 50px;

    border-radius: 50%;

    background: rgba(170, 135, 255, .20);

    filter: blur(100px);

    animation: softPulse 7s ease-in-out infinite reverse;

    pointer-events: none;
}


@keyframes softPulse {

    0%, 100% {
        opacity: .5;
        transform: scale(1);
    }

    50% {
        opacity: .8;
        transform: scale(1.12);
    }
}


/* =========================================================
   CÍRCULO
========================================================= */

.soft-circle {
    position: absolute;

    width: 700px;
    height: 700px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border: 1px solid rgba(210, 160, 205, .20);

    box-shadow:
        0 0 80px rgba(255, 170, 220, .10),
        inset 0 0 80px rgba(180, 150, 255, .08);

    pointer-events: none;
}


.soft-circle::before {
    content: "";

    position: absolute;

    inset: 35px;

    border-radius: 50%;

    border: 1px solid rgba(255, 180, 220, .15);
}


.soft-circle::after {
    content: "";

    position: absolute;

    inset: 80px;

    border-radius: 50%;

    border: 1px solid rgba(190, 160, 255, .12);
}


/* =========================================================
   LINHAS
========================================================= */

.soft-line {
    position: absolute;

    width: 100%;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 150, 205, .35),
        transparent
    );

    opacity: .6;
}


.line-one {
    top: 25%;
}


.line-two {
    top: 72%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(175, 145, 255, .35),
        transparent
    );
}


/* =========================================================
   CONTEÚDO
========================================================= */

.sanrio-content {
    position: relative;

    z-index: 10;

    width: min(1200px, 90%);

    margin: auto;

    padding: 90px 0 80px;
}


/* =========================================================
   TÍTULO
========================================================= */

.sanrio-tag {
    display: inline-block;

    margin-bottom: 18px;

    color: #c77aaa;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 5px;

    text-transform: uppercase;
}


.sanrio-title {
    max-width: 700px;

    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(55px, 8vw, 100px);

    font-weight: normal;

    line-height: .85;

    letter-spacing: -5px;
}


.sanrio-title span {
    color: #c58de4;

    font-style: italic;
}


.sanrio-description {
    max-width: 470px;

    margin-top: 28px;

    color: #8c788d;

    font-size: 13px;

    line-height: 1.8;
}


/* =========================================================
   CARDS
========================================================= */

.sanrio-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 20px;

    margin-top: 70px;
}


.sanrio-card {
    position: relative;

    height: 430px;

    overflow: hidden;

    background: rgba(255,255,255,.58);

    border: 1px solid rgba(210, 165, 205, .28);

    border-radius: 4px;

    transition:
        transform .4s ease,
        box-shadow .4s ease,
        border-color .4s ease;

    isolation: isolate;
}


.sanrio-card:hover {
    transform: translateY(-10px);

    border-color: rgba(190, 130, 205, .55);

    box-shadow:
        0 20px 60px rgba(150, 100, 160, .16);
}


/* =========================================================
   BRILHO
========================================================= */

.sanrio-card::before {
    content: "";

    position: absolute;

    inset: 0;

    z-index: -1;

    background:
        linear-gradient(
            145deg,
            rgba(255, 190, 220, .30),
            transparent 45%,
            rgba(190, 165, 255, .20)
        );
}


.sanrio-card::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    right: -70px;
    bottom: -70px;

    border-radius: 50%;

    background: rgba(220, 160, 235, .18);

    filter: blur(35px);
}


/* =========================================================
   NÚMERO
========================================================= */

.card-number {
    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 30;

    color: rgba(120, 90, 120, .45);

    font-size: 9px;

    letter-spacing: 2px;
}


/* =========================================================
   ÁREA DA IMAGEM
========================================================= */

.character-placeholder {
    position: absolute;

    inset: 30px 15px 75px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: rgba(150, 110, 150, .12);

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    border: 1px dashed rgba(180, 130, 180, .14);

    z-index: 1;
}


/* =========================================================
   PERSONAGENS
========================================================= */

.sanrio-character {
    position: absolute;

    left: 50%;
    bottom: 45px;

    transform: translateX(-50%);

    width: 110%;
    height: 82%;

    object-fit: contain;
    object-position: center bottom;

    display: block;

    z-index: 20;

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 16px rgba(100, 70, 110, .18)
        );
}


/* HELLO KITTY */

.sanrio-card:nth-child(1) .sanrio-character {
    width: 115%;
    height: 85%;
}


/* CINNAMOROLL */

.sanrio-card:nth-child(2) .sanrio-character {
    width: 120%;
    height: 82%;
}


/* BADTZ-MARU */

.sanrio-card:nth-child(3) .sanrio-character {
    width: 115%;
    height: 85%;
}


/* =========================================================
   NOMES
========================================================= */

.character-name {
    position: absolute;

    left: 20px;
    bottom: 20px;

    z-index: 30;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 22px;

    letter-spacing: 1px;
}


.character-role {
    position: absolute;

    right: 20px;
    bottom: 22px;

    z-index: 30;

    color: #a28fa3;

    font-size: 7px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =========================================================
   DIVISÃO
========================================================= */

.sanrio-divider {
    width: 100%;

    height: 1px;

    margin-top: 60px;

    background: linear-gradient(
        90deg,
        rgba(255, 150, 205, .45),
        transparent,
        rgba(180, 145, 255, .45)
    );
}


/* =========================================================
   RODAPÉ
========================================================= */

.sanrio-footer {
    margin-top: 35px;

    display: flex;

    justify-content: space-between;

    color: #aa9aaa;

    font-size: 8px;

    letter-spacing: 2px;
}


.sanrio-footer span:last-child {
    color: #c58de4;
}


/* =========================================================
   BOTÃO CONTINUAR
========================================================= */

.continue-area {
    display: flex;

    justify-content: center;

    margin-top: 55px;
}


.continue-button {
    display: flex;

    align-items: center;

    gap: 18px;

    padding: 15px 28px;

    color: #8d628d;

    text-decoration: none;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 3px;

    border: 1px solid rgba(190, 130, 190, .35);

    background: rgba(255,255,255,.35);

    backdrop-filter: blur(8px);

    transition:
        transform .3s ease,
        color .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}


.continue-button span {
    font-size: 18px;

    line-height: 0;
}


.continue-button:hover {
    transform: translateX(5px);

    color: #a55caf;

    border-color: rgba(190, 110, 200, .7);

    box-shadow:
        0 0 25px rgba(200, 130, 220, .18);
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 900px) {

    .sanrio-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}


@media (max-width: 600px) {

    .sanrio-content {
        padding-top: 60px;
    }


    .sanrio-title {
        font-size: 58px;

        letter-spacing: -3px;
    }


    .sanrio-grid {
        grid-template-columns: 1fr;

        gap: 15px;
    }


    .sanrio-card {
        height: 380px;
    }


    .sanrio-character {
        width: 110%;

        height: 82%;

        bottom: 42px;
    }


    .soft-circle {
        width: 450px;

        height: 450px;
    }


    .sanrio-footer {
        flex-direction: column;

        gap: 12px;
    }

}

</style>

</head>


<body>

<main class="sanrio-page">


    <!-- EFEITOS -->

    <div class="pink-light"></div>

    <div class="purple-light"></div>

    <div class="soft-circle"></div>

    <div class="soft-line line-one"></div>

    <div class="soft-line line-two"></div>


    <section class="sanrio-content">


        <!-- TÍTULO -->

        <span class="sanrio-tag">
            SOFT SIDE • SANRIO
        </span>


        <h1 class="sanrio-title">

            Seu lado
            <br>

            <span>fofo.</span>

        </h1>


        <p class="sanrio-description">

            Um cantinho dedicado aos personagens que
            deixam tudo mais leve, bonito e especial.

        </p>


        <!-- PERSONAGENS -->

        <div class="sanrio-grid">


            <!-- HELLO KITTY -->

            <article class="sanrio-card">

                <span class="card-number">
                    01
                </span>

                <div class="character-placeholder">
                    SANRIO
                </div>

                <img
                    src="png anv/helloo.png"
                    class="sanrio-character"
                    alt="Hello Kitty"
                >

                <h2 class="character-name">
                    Hello Kitty
                </h2>

                <span class="character-role">
                    Hello Kitty
                </span>

            </article>


            <!-- CINNAMOROLL -->

            <article class="sanrio-card">

                <span class="card-number">
                    02
                </span>

                <div class="character-placeholder">
                    SANRIO
                </div>

                <img
                    src="png anv/cinna.png"
                    class="sanrio-character"
                    alt="Cinnamoroll"
                >

                <h2 class="character-name">
                    Cinnamoroll
                </h2>

                <span class="character-role">
                    Cinnamoroll
                </span>

            </article>


            <!-- BADTZ-MARU -->

            <article class="sanrio-card">

                <span class="card-number">
                    03
                </span>

                <div class="character-placeholder">
                    SANRIO
                </div>

                <img
                    src="png anv/batman.png"
                    class="sanrio-character"
                    alt="Badtz-Maru"
                >

                <h2 class="character-name">
                    Badtz-Maru
                </h2>

                <span class="character-role">
                    Badtz-Maru
                </span>

            </article>


        </div>


        <!-- DIVISÃO -->

        <div class="sanrio-divider"></div>


        <!-- RODAPÉ -->

        <footer class="sanrio-footer">

            <span>
                SOFT SIDE
            </span>

            <span>
                MADE WITH LOVE
            </span>

        </footer>


        <!-- CONTINUAR -->

        <div class="continue-area">

            <a
                href="memories.html"
                class="continue-button"
            >
                CONTINUAR

                <span>
                    →
                </span>

            </a>

        </div>


    </section>


</main>

</body>

</html>
```
